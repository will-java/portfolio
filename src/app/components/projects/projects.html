<section id="projects" class="section reveal">
  <h2>Projetos</h2>
  <div class="projects-grid">
    @for (project of projects; track project.title) {
      <article class="card project-card">
        <img [src]="project.imageUrl" [alt]="'Imagem do projeto ' + project.title" loading="lazy" />
        <div class="content">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="stack-list">
            @for (item of project.stack; track item) {
              <span class="badge">{{ item }}</span>
            }
          </div>
          <div class="actions">
            <a class="btn" [href]="project.githubUrl" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a class="btn ghost" [href]="project.demoUrl" target="_blank" rel="noopener noreferrer">Demo</a>
          </div>
        </div>
      </article>
    }
  </div>
</section>
